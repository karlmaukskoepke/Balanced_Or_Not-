<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What Makes It Balance?</title>
  <link rel="stylesheet" href="css/style.css?v=v3s6">
</head>
<body class="app" data-step="build">
  <header class="bar">
    <span class="bar-title">What Makes It Balance?</span>
    <nav class="eqstrip" id="eqstrip" aria-label="Equations"></nav>
    <ol class="steps" id="steps" aria-label="Steps for this equation">
      <li data-step="build">Build</li>
      <li data-step="slide">Slide</li>
      <li data-step="check">Check</li>
      <li data-step="solve">Solve</li>
      <li data-step="compare">Compare</li>
    </ol>
    <span class="bar-tools">
      <button type="button" class="btn btn-help" id="help" aria-label="Show me around (help)">?</button>
      <a href="teachers.html">Teachers</a>
      <button type="button" class="linkish" id="start-over">Start over</button>
    </span>
  </header>

  <main class="stage">
    <section class="col-slide" id="col-slide" aria-label="Slider for x">
      <p class="spot-msg" id="spot-msg" role="alert"></p>
      <div class="vs-host" id="vslider"></div>
      <form class="x-form" id="x-form" autocomplete="off">
        <label for="x-input" class="x-label"><span class="eqn-x">x</span> =</label>
        <input id="x-input" class="x-input" type="text" inputmode="text" spellcheck="false" autocomplete="off">
        <button type="submit" class="btn btn-primary" id="x-go">Go</button>
      </form>
      <p class="msg" id="x-msg" aria-live="polite"></p>
    </section>

    <section class="col-center" aria-label="Equation and balance">
      <div class="eq-area">
        <span class="eq-number" id="eq-number" aria-hidden="true"></span>
        <h1 class="eq-display" id="eq-display"></h1>
      </div>
      <div class="palettes" id="palettes" hidden>
        <div class="palette" data-side="left" role="group" aria-label="Build the left side">
          <button type="button" class="btn pbtn" data-act="x">x</button>
          <button type="button" class="btn pbtn" data-act="plus">+1</button>
          <button type="button" class="btn pbtn" data-act="minus">&minus;1</button>
          <button type="button" class="linkish pclear" data-act="clear">clear side</button>
        </div>
        <div class="palette" data-side="right" role="group" aria-label="Build the right side">
          <button type="button" class="btn pbtn" data-act="x">x</button>
          <button type="button" class="btn pbtn" data-act="plus">+1</button>
          <button type="button" class="btn pbtn" data-act="minus">&minus;1</button>
          <button type="button" class="linkish pclear" data-act="clear">clear side</button>
        </div>
      </div>
      <div class="balance-box" id="balance-box">
        <svg id="balance" class="balance"></svg>
      </div>
      <div class="readout" id="readout">
        <span class="tot" id="tot-left" aria-label="Left total"></span>
        <span class="rel" id="rel" aria-hidden="true"></span>
        <span class="tot" id="tot-right" aria-label="Right total"></span>
        <span class="sr-only" id="rel-sr" aria-live="polite"></span>
      </div>
    </section>

    <section class="col-right" aria-label="What to do">
      <div class="prompt" id="prompt" aria-live="polite"></div>
    </section>

    <div class="stop" id="stop" hidden role="region" aria-live="polite"></div>
  </main>
  <div class="veil" id="veil" hidden></div>
  <div class="xbox" id="xbox"><span></span></div>

  <div class="coach" id="coach" hidden>
    <div class="coach-ring" id="coach-ring"></div>
    <div class="coach-bubble" id="coach-bubble" role="dialog" aria-modal="true" aria-labelledby="coach-text">
      <p class="coach-text" id="coach-text"></p>
      <div class="coach-buttons">
        <button type="button" class="linkish" id="coach-skip">Skip</button>
        <span class="coach-count" id="coach-count"></span>
        <button type="button" class="btn btn-primary" id="coach-next">Next</button>
      </div>
    </div>
  </div>

  <script src="js/exact.js?v=v3s6"></script>
  <script src="js/equations.js?v=v3s6"></script>
  <script src="js/model.js?v=v3s6"></script>
  <script src="js/flow.js?v=v3s6"></script>
  <script src="js/equation-view.js?v=v3s6"></script>
  <script src="js/balance.js?v=v3s6"></script>
  <script src="js/vslider.js?v=v3s6"></script>
  <script src="js/explore.js?v=v3s6"></script>
  <script src="js/activity.js?v=v3s6"></script>
</body>
</html>
